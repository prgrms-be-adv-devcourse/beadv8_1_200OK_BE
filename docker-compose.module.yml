# 모듈 하나를 컨테이너로 띄우는 <모듈>/compose.yml이 함께 쓰는 설정이다 (#783). 이 파일만으로는 띄우지 않는다
# 모듈 파일이 extends로 가져와 이미지 이름, 빌드할 모듈, 포트, 모듈 .env만 더한다
# MySQL·Redis·Kafka는 루트 docker-compose.yml이 띄운 것을 같이 쓴다. 다른 프로젝트라 depends_on을 걸 수 없어, 루트를 먼저 올린다
services:
  module:
    build:
      context: .
    networks: [db-net, kafka-net]
    # 뒤에 읽은 파일이 이긴다. 모듈 파일이 <모듈>/.env(모듈 DB 계정)를 이 목록 뒤에 더해 루트 값을 덮는다
    env_file:
      - path: .env
        required: false
    environment:
      # 시간대를 기본값에 기대지 않고 명시 (#93). JVM 시간대는 Dockerfile에서 따로 고정
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Seoul}
      # .env의 접속 주소(localhost)는 내 PC에서 실행하는 앱용이라 컨테이너 안에서는 자기 자신을 가리키므로 compose 네트워크 이름으로 덮는다
      DB_HOST: mysql
      DB_PORT: 3306
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 모듈 단독 실행은 common-redis.yaml을 가져오지 않아 Spring Boot 기본 키로 Redis 주소를 정한다
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 모듈 설정이 ${OK_ROOT_DIR}/keys 에서 JWT 키를 읽는다. 컨테이너의 작업 디렉터리(/app)에 keys를 연결한다
      OK_ROOT_DIR: /app
      # 힙 상한을 mem_limit의 35%(약 180m)로 둔다. refund 실측(NMT)에서 메타스페이스·코드 캐시·심볼 같은 힙 밖 메모리가 약 290MB였고,
      # 기동 뒤 GC 후 힙은 약 100MB였다. 50%(256m)로 두면 둘을 합쳐 512m를 넘어 OOM kill됐다
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=35
    # 모듈 8개를 함께 띄워도 Docker 메모리를 다 쓰지 않도록 한 개당 512m로 막는다. 한도가 없으면 메모리가 모자랄 때 아무 컨테이너나 OOM kill된다
    # memswap_limit을 같게 두어 swap을 쓰지 않는다. 한도를 넘으면 느려지며 버티지 않고 OOM kill된다 (운영과 동일)
    mem_limit: 512m
    memswap_limit: 512m
    # 개인키를 이미지에 넣을 수 없어 마운트한다(.dockerignore가 keys를 뺀다). 앱은 읽기만 하므로 ro
    volumes:
      - ./keys:/app/keys:ro
    healthcheck:
      # 모듈 단독 실행은 관리 포트를 따로 두지 않아 서비스 포트(SERVER_PORT)에서 health를 본다
      test: ['CMD-SHELL', 'wget -qO- "http://localhost:$$SERVER_PORT/actuator/health" | grep -q UP']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 5s
