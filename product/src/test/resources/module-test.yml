# product 통합 테스트 전용 설정. common의 application-test.yml이 읽는다 (#485)
product:
  search:
    # 테스트 상품(10개 안팎)에 맞춘 하한이다. 점수는 상품 수에 따라 달라지므로(FULLTEXT IDF) 운영 값과 같지 않아도 된다.
    # 이 값에서 자모로만 걸리는 오타(0.88 안팎)는 남고, 자모 조각 하나만 겹친 상품(0.46 이하)은 빠진다
    min-score: 0.5
    # 타임아웃 테스트가 오래 기다리지 않도록 JDBC가 허용하는 가장 짧은 값(1초)으로 둔다
    query-timeout: 1s
