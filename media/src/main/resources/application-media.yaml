ok:
  flyway:
    standalone: true
server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: media
  config:
    import: optional:file:${OK_ROOT_DIR:.}/.env[.properties],optional:file:.env[.properties],classpath:common-async.yaml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/paldogotgan_media?serverTimezone=${APP_TIME_ZONE:Asia/Seoul}&characterEncoding=UTF-8
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:password}
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Seoul}
    serialization:
      fail-on-empty-beans: false
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
          time_zone: ${APP_TIME_ZONE:Asia/Seoul}
  flyway:
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
  modulith:
    events:
      republish-outstanding-events-on-restart: ${MODULITH_REPUBLISH_ON_RESTART:false}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
app:
  problem:
    base-uri: ${PROBLEM_BASE_URI:about:blank}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:local-bucket}
jwt:
  issuer: paldo-gotgan
  audience: paldo-gotgan-api
  # 발급 모듈(member)의 JWKS 주소. 설정하면 공개키를 이 주소에서 받아 검증하고, 아래 verification-keys는 읽지 않는다.
  # 비어 있으면(로컬 기본값) 아래 공개키 파일로 검증한다. 모듈을 따로 배포할 때 환경변수로 넣는다 (docs/DEVELOPMENT.md 8절)
  jwk-set-uri: ${JWT_JWK_SET_URI:}
  # 검증용 공개키 목록. 토큰 헤더의 kid로 키를 고른다. 키 교체 절차는 docs/DEVELOPMENT.md 8절
  verification-keys:
    - key-id: rs256-v1
      public-key: file:${OK_ROOT_DIR:.}/keys/rs256-v1-public.pem
  access-token-expiration: 30m
  refresh-token-expiration: 14d
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    com.ok: ${LOG_LEVEL_OK:INFO}
