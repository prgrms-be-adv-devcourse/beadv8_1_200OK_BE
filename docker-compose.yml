name: server

networks:
  db-net:
    name: db-net
    driver: bridge
  # Kafka는 app만 닿으면 되므로 DB 네트워크와 나눈다 (#318)
  kafka-net:
    name: kafka-net
    driver: bridge
  # Grafana는 Prometheus만 닿으면 되므로 DB 네트워크와 나눈다 (#374)
  monitoring-net:
    name: monitoring-net
    driver: bridge

# ---------- Kafka 브로커 3대가 같이 쓰는 설정 (#318) ----------
# 클러스터 1개에 브로커 3대, 브로커와 컨트롤러를 한 프로세스에서 같이 돌리는 KRaft combined 모드다
# 운영(deploy/compose.prod.yml)과 같은 구성으로 띄워 "로컬에선 되는데 운영에선 안 되는" 차이를 줄인다
# apache/kafka 이미지는 KAFKA_* 환경변수를 하나라도 넣으면 이미지 기본 설정을 전혀 쓰지 않으므로, 필요한 값을 모두 적는다
x-kafka-environment: &kafka-environment
  KAFKA_PROCESS_ROLES: broker,controller
  # 3대가 같은 값을 가져야 한 클러스터로 묶인다. 로컬 전용 값이고 비밀값이 아니다(kafka-storage.sh random-uuid로 만듦)
  # 바꾸면 기존 볼륨과 맞지 않아 브로커가 뜨지 않는다. 바꿔야 하면 docker compose down -v 로 볼륨까지 지운다
  CLUSTER_ID: v5I7hBoeQPSr-DA6PyvvRw
  # 3대 중 2대(과반)가 모여야 컨트롤러를 뽑고 시작한다. 그래서 브로커끼리는 depends_on을 걸지 않고 동시에 띄운다
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  # INTERNAL: 브로커끼리 복사, 컨테이너 안의 앱 / CONTROLLER: 브로커끼리 투표 / EXTERNAL: 내 PC에서 실행한 앱
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # 복제 기본값은 1벌이라 3대를 띄운 의미가 없어서 3벌로 올린다
  # 메시지가 2대 이상에 저장돼야 발행 성공(프로듀서 acks=all과 짝)이라 1대가 고장 나도 발행이 계속된다
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # 넣지 않으면 Kafka 기본 힙이 1GB라 3대면 힙만 3GB가 된다. 운영과 같은 값으로 맞춘다
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

x-kafka-service: &kafka-service
  image: apache/kafka:${KAFKA_VERSION:-4.2.1}
  networks: [kafka-net]
  # 기본 10초 안에 안 꺼지면 강제 종료(137)되는데, 마지막으로 남은 브로커는 넘길 상대가 없어 정상 종료가 10초를 넘길 수 있다
  # 강제 종료되면 다음 기동 때 로그 복구로 오래 걸리므로 넉넉히 기다린다
  stop_grace_period: 30s
  healthcheck:
    # 브로커가 요청을 받을 수 있는지 묻는다. 이 명령도 JVM을 띄우므로 힙을 작게 묶는다(컨테이너의 KAFKA_HEAP_OPTS 384m를 그대로 쓰지 않게)
    test: ['CMD-SHELL', 'KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null']
    # 확인할 때마다 JVM이 하나 더 떠서 메모리·CPU를 쓰므로, 평소에는 30초마다만 확인한다
    interval: 30s
    timeout: 10s
    # 연속 4번(약 2분) 실패하면 unhealthy
    retries: 4
    # 3대 중 2대가 모여 컨트롤러를 뽑을 때까지 걸리는 시간을 실패로 세지 않는다
    # 이 동안에는 5초마다 확인해, 간격을 늘려도 기동 직후 healthy가 늦게 잡히지 않게 한다 (Docker Engine 25 이상)
    start_period: 60s
    start_interval: 5s

services:
  mysql:
    extends:
      file: ./infra/mysql/compose.yml
      service: mysql
    networks: [db-net]
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  redis:
    image: redis:${REDIS_VERSION:-8.10}-alpine
    networks: [db-net]
    # 운영과 같은 상한으로 두어, 상한에 닿았을 때(noeviction이라 쓰기 실패) 동작을 로컬에서 먼저 볼 수 있게 한다
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    # maxmemory 256mb에 데이터 외 오버헤드 여유를 더한 값 (운영과 동일)
    mem_limit: 384m
    ports:
      # 로컬 Redis는 비밀번호가 없어 loopback에만 연다(LAN 노출 방지). 컨테이너 안의 앱은 compose 네트워크로 접속한다
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # 브로커 3대는 이름·번호·외부 포트만 다르다
  # 외부 포트는 127.0.0.1에만 열어 같은 네트워크의 다른 기기가 붙지 못하게 한다 (인증 없는 PLAINTEXT라서)
  # EXTERNAL로 알려 주는 주소(localhost:포트)가 PC에서 다시 접속하는 주소라, 열어 둔 호스트 포트와 같아야 한다
  kafka-1:
    <<: *kafka-service
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:${KAFKA_1_PORT:-19092}
    ports:
      - "127.0.0.1:${KAFKA_1_PORT:-19092}:9094"
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-service
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:${KAFKA_2_PORT:-29092}
    ports:
      - "127.0.0.1:${KAFKA_2_PORT:-29092}:9094"
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-service
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:${KAFKA_3_PORT:-39092}
    ports:
      - "127.0.0.1:${KAFKA_3_PORT:-39092}:9094"
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # Kafka 지표 수집 (#396). 브로커 상태·복제·컨슈머 랙을 Prometheus 형식 숫자로 내놓는다
  # 브로커 JVM에 끼워 넣는 JMX exporter 대신 별도 컨테이너를 쓴다. 브로커 메모리(운영 680m)와 JVM 옵션을 건드리지 않고, 컨슈머 랙도 이쪽에서만 나온다
  kafka-exporter:
    # 평소 개발(docker compose up -d)에는 뜨지 않고, 모니터링을 볼 때만 띄운다
    profiles: [monitoring]
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_VERSION:-v1.11.0}
    # 브로커만 보면 되므로 DB 네트워크(db-net)에는 붙이지 않는다
    # monitoring-net: prometheus가 kafka-exporter:9308로 읽는다. prometheus를 kafka-net에 붙이면 브로커에도 닿게 되므로 exporter 쪽에서 맞춘다
    networks: [kafka-net, monitoring-net]
    # 지표 수집만 하는 작은 프로세스라 작게 묶는다. 넘기면 docker stats를 보고 조정한다
    mem_limit: 64m
    # 메모리 초과 등으로 죽어도 다시 띄운다. 직접 멈춘(docker compose stop) 경우는 다시 띄우지 않는다
    restart: unless-stopped
    # 지표 주소가 응답하는지 본다. docker compose ps에 healthy로 보이고, Prometheus가 depends_on으로 기다릴 수 있다
    # 조회할 때마다 브로커에 묻기 때문에 브로커 헬스체크와 같은 30초 간격으로 둔다
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'localhost:9308/metrics']
      interval: 30s
      timeout: 10s
      retries: 3
      # 브로커 3대가 healthy가 된 뒤에 뜨므로, 처음 브로커에 연결할 시간만 둔다
      start_period: 20s
      start_interval: 5s
    command:
      # 3대를 모두 적는다. 1대만 적으면 그 브로커를 멈췄을 때 클러스터 정보를 못 얻어, 브로커 1대 장애를 확인할 수 없다
      # 컨테이너 안이므로 브로커끼리 쓰는 INTERNAL 주소를 쓴다 (localhost:19092 같은 EXTERNAL은 컨테이너 자신을 가리킨다)
      - --kafka.server=kafka-1:9092
      - --kafka.server=kafka-2:9092
      - --kafka.server=kafka-3:9092
    # 시작할 때 브로커에 못 붙으면 바로 종료되므로, 앱과 같이 3대가 healthy가 된 뒤에 띄운다
    # 이미 떠 있는 exporter는 그 뒤에 브로커 1대가 멈춰도 나머지로 계속 수집한다
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    # 포트는 열지 않는다. Prometheus는 monitoring-net 안에서 kafka-exporter:9308로 읽는다(#395)
    # 직접 보려면 docker compose exec kafka-exporter wget -qO- localhost:9308/metrics

  app:
    profiles: [app]
    build: .
    image: paldo-gotgan:local
    # db-net: mysql 접속 / kafka-net: 브로커 접속
    networks: [db-net, kafka-net]
    depends_on:
      mysql:
        condition: service_healthy
      # mysql과 같이 Redis도 healthy가 된 뒤에 앱을 띄워, 기동 직후 Redis 연결이 실패할 여지를 없앤다
      redis:
        condition: service_healthy
      # mysql과 같이 Kafka 3대도 healthy가 된 뒤에 앱을 띄운다 (#318)
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # 시간대를 기본값에 기대지 않고 명시 (#93). .env 에 값이 있으면 그 값을, 없으면 팀 기준 Asia/Seoul 을 쓴다
      # 앱(application.yaml)의 Jackson·JDBC·Hibernate 시간대가 이 값을 따른다. JVM 시간대는 Dockerfile 에서 따로 고정
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Seoul}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-paldogotgan}?serverTimezone=${APP_TIME_ZONE:-Asia/Seoul}&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-myuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-password}
      # .env의 REDIS_PORT는 호스트 포트라 컨테이너 안에서는 고정값으로 덮는다 (DB_URL과 같은 이유)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # .env의 KAFKA_BOOTSTRAP_SERVERS(localhost:...)는 내 PC에서 실행하는 앱용이라 컨테이너 안에서는 자기 자신을 가리킨다
      # DB_URL과 같은 이유로 compose 네트워크의 브로커 이름으로 덮는다 (#318)
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    # JWT 키 폴더를 읽기 전용으로 연결한다. 앱 기본 설정(application.yaml)이 file:keys/... 로 실행 디렉터리 기준 경로를 읽고
    # 컨테이너의 작업 디렉터리가 /app 이라 /app/keys 에 파일이 있어야 한다. 개인키를 이미지에 넣을 수 없어 마운트하며, 앱은 읽기만 하므로 ro
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "${APP_PORT:-8080}:8080"

  # ---------- 모니터링 (#374). monitoring 프로파일일 때만 뜬다: docker compose --profile monitoring up -d ----------
  # 설정 파일은 운영(deploy/compose.prod.yml)과 같은 deploy/monitoring을 쓴다
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.1}
    # db-net: mysqld-exporter와 컨테이너 앱(--profile app)에 닿는다 / monitoring-net: grafana가 닿는다
    networks: [db-net, monitoring-net]
    # 운영과 같은 보존 상한. 로컬은 이름 있는 볼륨이라 docker compose down -v 로 지우면 지표도 사라진다
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    # 내 PC에서 bootRun한 앱(호스트의 18080)에 닿게 한다. Docker Desktop에는 기본으로 있지만 Linux에는 없어서 명시한다
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 인증이 없어 loopback에만 연다(LAN 노출 방지)
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 수집 대상. 기본은 컨테이너 앱(app:18080)이고, IDE·bootRun으로 띄운 앱을 보려면 이 폴더의 app.yml을 host.docker.internal:18080으로 바꾼다 (docs/DEVELOPMENT.md)
      - ./deploy/monitoring/prometheus/targets/local:/etc/prometheus/targets:ro
      # 폴더를 직접 연결하지 않는 이유는 kafka 볼륨과 같다(컨테이너 사용자 권한)
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9090/-/healthy > /dev/null']
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    profiles: [monitoring]
    image: grafana/grafana-oss:${GRAFANA_VERSION:-13.0.2}
    # prometheus만 닿으면 되므로 db-net에 붙이지 않는다
    networks: [monitoring-net]
    environment:
      # 로컬 기본값. 이 비밀번호는 Grafana DB가 처음 만들어질 때만 쓰이고, 나중에 바꾸려면 grafana-data 볼륨을 지운다
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # 데이터소스·대시보드는 파일로만 등록한다. Grafana에는 MySQL 데이터소스를 만들지 않으므로 DB 계정이 필요 없다
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health | grep -q ok']
      interval: 5s
      timeout: 3s
      retries: 20

  mysqld-exporter:
    profiles: [monitoring]
    image: prom/mysqld-exporter:${MYSQLD_EXPORTER_VERSION:-v0.21.0}
    # mysql에만 닿으면 되고 prometheus가 같은 db-net에서 가져간다. 9104는 호스트에 열지 않는다
    networks: [db-net]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-exporterpassword}
    # 계정 exporter는 deploy/monitoring/create-exporter-user.sh로 만든다(docs/DEVELOPMENT.md). 계정이 없어도 뜨고 mysql_up만 0이다
    # 비밀번호는 명령행에 넘기지 않고 컨테이너 안 설정 파일(--config.my-cnf)로 넘긴다 (운영과 같은 방식)
    entrypoint: [sh, -c]
    command:
      - |
        umask 077
        printf '[client]\nuser=exporter\npassword="%s"\nhost=mysql\n' "$$MYSQL_EXPORTER_PASSWORD" > /tmp/exporter.cnf
        exec /bin/mysqld_exporter --config.my-cnf=/tmp/exporter.cnf

  # Redis 지표 (#395). 한 exporter가 대상 주소를 받아 여러 Redis를 읽는다(multi-target)
  # 단일 노드든 클러스터든 이 서비스는 그대로고, 대상은 deploy/monitoring/prometheus/targets/local/redis.yml에 한 줄씩 적는다
  redis-exporter:
    profiles: [monitoring]
    image: oliver006/redis_exporter:${REDIS_EXPORTER_VERSION:-v1.97.0}-alpine
    # redis에만 닿으면 되고 prometheus가 같은 db-net에서 가져간다. 9121은 호스트에 열지 않는다
    networks: [db-net]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # 비밀번호는 명령행 인자(--redis.password)가 아니라 환경변수로 넘겨 ps·로그에 남기지 않는다. 비어 있으면 없이 접속한다(로컬 Redis는 비밀번호가 없다)
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    mem_limit: 64m

  # 컨테이너별 CPU 스로틀링·메모리 지표. 호스트 포트는 열지 않고 prometheus가 monitoring-net에서 cadvisor:8080으로 읽는다
  cadvisor:
    profiles: [monitoring]
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION:-v0.60.6}
    networks: [monitoring-net]
    command:
      # 도커 컨테이너만 본다. 호스트의 다른 cgroup(systemd 서비스 등)까지 시계열이 늘어나는 것을 막는다
      - --docker_only=true
      # 기본 1초는 CPU를 계속 쓰므로 prometheus 수집 주기(15s)에 맞춘다
      - --housekeeping_interval=15s
      # 컨테이너 라벨을 시계열마다 붙이면 container_label_* 라벨이 수십 개 생겨 지표가 무거워진다. 대시보드는 name만 쓴다
      - --store_container_labels=false
      # 대시보드가 쓰지 않는 지표 묶음을 꺼서 수집 비용을 줄인다. cpu·memory는 켜 둔다
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl,oom_event,disk,diskIO,network,memory_numa
    # 컨테이너 20개 안팎에서 docker stats로 본 사용량은 약 17MB였다. 컨테이너가 늘어도 넘지 않을 여유를 둔 상한이다
    mem_limit: 128m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      # Docker Desktop(Mac)은 /var/run만 마운트하면 도커 소켓을 못 찾아 컨테이너가 하나도 안 보여서 소켓을 따로 연결한다
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

# 브로커마다 따로 둔다. 같은 볼륨을 나눠 쓰면 서로의 데이터를 덮어써 망가진다
# 폴더를 직접 연결하지 않고 이름 있는 볼륨을 쓰는 이유: Windows 폴더는 컨테이너 사용자(appuser) 권한과 맞지 않아 기동에 실패하기 쉽다
# docker compose down -v 를 하면 지워지고 새 클러스터로 다시 시작한다 (토픽·메시지도 모두 사라짐)
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  # 모니터링 데이터. docker compose --profile monitoring down -v 를 하면 지워진다
  prometheus-data:
  grafana-data:
