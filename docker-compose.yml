name: server

networks:
  db-net:
    name: db-net
    driver: bridge

services:
  mysql:
    extends:
      file: ./infra/mysql/compose.yml
      service: mysql
    networks: [db-net]
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  redis:
    image: redis:${REDIS_VERSION:-8.10}-alpine
    networks: [db-net]
    ports:
      # 로컬 Redis는 비밀번호가 없어 loopback에만 연다(LAN 노출 방지). 컨테이너 안의 앱은 compose 네트워크로 접속한다
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: [app]
    build: .
    image: paldo-gotgan:local
    networks: [db-net]
    depends_on:
      mysql:
        condition: service_healthy
      # mysql과 같이 Redis도 healthy가 된 뒤에 앱을 띄워, 기동 직후 Redis 연결이 실패할 여지를 없앤다
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # 시간대를 기본값에 기대지 않고 명시 (#93). .env 에 값이 있으면 그 값을, 없으면 팀 기준 Asia/Seoul 을 쓴다
      # 앱(application.yaml)의 Jackson·JDBC·Hibernate 시간대가 이 값을 따른다. JVM 시간대는 Dockerfile 에서 따로 고정
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Seoul}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-paldogotgan}?serverTimezone=${APP_TIME_ZONE:-Asia/Seoul}&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-myuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-password}
      # .env의 REDIS_PORT는 호스트 포트라 컨테이너 안에서는 고정값으로 덮는다 (DB_URL과 같은 이유)
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${APP_PORT:-8080}:8080"
