# 외부에는 /api/v1/**만 공개한다. 내부 API(/internal), actuator, swagger는 존재를 드러내지 않도록 404로 막는다
server {
    listen 80 default_server;
    server_name _;

    # 앱의 multipart 제한(30MB)보다 약간 크게 잡는다. 업로드 크기 오류는 nginx가 아니라 앱이 판단하게 하기 위함이다
    client_max_body_size 32m;

    # nginx는 proxy_pass 호스트를 시작할 때 한 번만 조회한다.
    # 배포로 app 컨테이너가 다시 만들어지면 IP가 바뀌어 502가 나므로, docker 내장 DNS로 다시 조회한다
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8080;

    location /api/v1/ {
        # URI 없이 변수만 쓰면 클라이언트가 보낸 경로가 그대로 전달된다
        proxy_pass $app_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /internal/ {
        return 404;
    }

    location / {
        return 404;
    }
}
