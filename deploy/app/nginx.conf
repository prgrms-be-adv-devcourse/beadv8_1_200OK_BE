server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    client_max_body_size 32m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff_upstream http://bff:8787;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/ {
        proxy_pass $bff_upstream;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /bff/ {
        proxy_pass $bff_upstream;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /internal/ {
        return 404;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 32m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    location /internal/ {
        allow 127.0.0.1;
        deny all;

        location /internal/v1/wallets  { proxy_pass http://127.0.0.1:8083; }
        location /internal/v1/orders   { proxy_pass http://127.0.0.1:8084; }
        location /internal/v1/products { proxy_pass http://127.0.0.1:8085; }
        location /internal/v1/delivery { proxy_pass http://127.0.0.1:8086; }
        location /internal/ { return 404; }
    }

    location = /.well-known/jwks.json { proxy_pass http://127.0.0.1:8082; }

    location /api/v1/media { proxy_pass http://127.0.0.1:8081; }

    location /api/v1/auth                       { proxy_pass http://127.0.0.1:8082; }
    location /api/v1/members                    { proxy_pass http://127.0.0.1:8082; }
    location /api/v1/sellers/me/applications    { proxy_pass http://127.0.0.1:8082; }
    location /api/v1/sellers/me/profile         { proxy_pass http://127.0.0.1:8082; }
    location /api/v1/admin/seller-applications  { proxy_pass http://127.0.0.1:8082; }

    location /api/v1/wallets { proxy_pass http://127.0.0.1:8083; }

    location /api/v1/cart   { proxy_pass http://127.0.0.1:8084; }
    location /api/v1/orders { proxy_pass http://127.0.0.1:8084; }

    location /api/v1/products                 { proxy_pass http://127.0.0.1:8085; }
    location /api/v1/reviews                  { proxy_pass http://127.0.0.1:8085; }
    location /api/v1/sellers/me/products      { proxy_pass http://127.0.0.1:8085; }
    location /api/v1/admin/review-analysis    { proxy_pass http://127.0.0.1:8085; }

    location /api/v1/shipments              { proxy_pass http://127.0.0.1:8086; }
    location /api/v1/seller/shipments       { proxy_pass http://127.0.0.1:8086; }
    location /api/v1/carrier-notifications  { proxy_pass http://127.0.0.1:8086; }
    location /api/v1/admin/postal-regions   { proxy_pass http://127.0.0.1:8086; }

    location /api/v1/payouts        { proxy_pass http://127.0.0.1:8087; }
    location /api/v1/admin/payouts  { proxy_pass http://127.0.0.1:8087; }

    location /api/v1/refunds         { proxy_pass http://127.0.0.1:8088; }
    location /api/v1/seller/refunds  { proxy_pass http://127.0.0.1:8088; }

    location / {
        return 404;
    }
}
