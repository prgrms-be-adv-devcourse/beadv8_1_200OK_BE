# 운영 EC2(/opt/paldo-gotgan)에서 deploy.sh로 실행한다. 절차는 docs/DEPLOY.md
# app·mysql·redis·kafka는 호스트 포트를 열지 않는다. 외부에서는 nginx(80)만 닿는다
name: paldo-gotgan

# ---------- Kafka 브로커 3대가 같이 쓰는 설정 (#318) ----------
# 클러스터 1개에 브로커 3대, KRaft combined 모드다. 로컬 docker-compose.yml과 같은 구성이고, 다른 점은
# 외부 포트를 열지 않는 것(EXTERNAL listener 없음), 메모리 제한, 디스크 용량 상한, 클러스터 ID를 .env에서 받는 것이다
# 같은 EC2에 3대를 두므로 브로커 1대 고장은 버티지만 EC2가 죽으면 3대가 함께 죽고, 처리량도 늘지 않는다 (장애 대비용)
# apache/kafka 이미지는 KAFKA_* 환경변수를 하나라도 넣으면 이미지 기본 설정을 전혀 쓰지 않으므로, 필요한 값을 모두 적는다
x-kafka-environment: &kafka-environment
  KAFKA_PROCESS_ROLES: broker,controller
  # 3대가 같은 값을 가져야 한 클러스터로 묶인다. 비밀값은 아니지만 서버마다 정하므로 .env에서 받는다
  # 처음 정한 뒤 바꾸면 기존 볼륨과 맞지 않아 브로커가 뜨지 않는다 (docs/DEPLOY.md)
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID가 필요하다}
  # 3대 중 2대(과반)가 모여야 컨트롤러를 뽑고 시작한다. 그래서 브로커끼리는 depends_on을 걸지 않는다
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  # INTERNAL: 브로커끼리 복사, app 접속 / CONTROLLER: 브로커끼리 투표. 밖에서 붙는 listener는 두지 않는다
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # 메시지를 3대에 복사하고, 2대 이상에 저장돼야 발행 성공으로 본다(앱의 acks=all과 짝). 1대가 고장 나도 발행이 계속된다
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # 데이터는 루트 디스크(30GB, 도커 볼륨)에 둔다. /data(EBS)는 MySQL 전용이라 Kafka가 디스크를 채워도 MySQL은 멈추지 않는다
  # 보관 기간(기본 7일)보다 용량이 먼저 차는 경우를 막으려고 파티션 하나당 256MB까지만 남기고 오래된 것부터 지운다
  # 예) 토픽 5개 × 파티션 1개 × 복사 3벌 × 256MB ≈ 3.8GB. 토픽이 늘면 docs/DEPLOY.md의 디스크 예산을 다시 계산한다
  # 오래된 메시지는 세그먼트 파일 단위로만 지워지고 쓰는 중인 파일은 지우지 않으므로, 세그먼트를 상한보다 작게 둬야 상한이 동작한다
  KAFKA_LOG_RETENTION_BYTES: 268435456
  KAFKA_LOG_SEGMENT_BYTES: 67108864
  # 힙은 비율이 아니라 고정값으로 잡는다. Kafka는 힙보다 OS 페이지 캐시를 많이 써서 mem_limit 안에 그 자리를 남겨야 한다 (384/680)
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

x-kafka-service: &kafka-service
  image: apache/kafka:${KAFKA_VERSION:?KAFKA_VERSION이 필요하다}
  restart: unless-stopped
  # Kafka는 app만 닿으면 되므로 mysql·nginx가 있는 기본 네트워크와 나눈다 (#318)
  networks: [kafka-net]
  # 기본 10초 안에 안 꺼지면 강제 종료(137)되는데, 리더를 넘기는 정상 종료가 10초를 넘길 수 있다
  # 강제 종료되면 다음 기동 때 로그 복구로 오래 걸려 1대씩 재시작(kafka-rollout.sh)이 느려지므로 넉넉히 기다린다
  stop_grace_period: 30s
  # 3대 합계 약 2GB. 한 대가 메모리를 몰아 써서 다른 브로커까지 죽이지 않게 대마다 묶는다 (docs/DEPLOY.md 메모리 예산)
  mem_limit: 680m
  healthcheck:
    # 브로커가 요청을 받을 수 있는지 묻는다. 이 명령도 JVM을 띄우므로 힙을 작게 묶는다(컨테이너의 KAFKA_HEAP_OPTS 384m를 그대로 쓰지 않게)
    # app이 이 결과(healthy)를 기다리므로 재시도를 둬서 바쁠 때의 일시적 실패로 배포가 막히지 않게 한다
    test: ['CMD-SHELL', 'KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null']
    # 확인할 때마다 JVM이 하나 더 떠서 브로커와 같은 mem_limit 안에서 메모리를 쓰고 CPU 크레딧(cpu_credits=standard)도 쓴다
    # 3대 × 10초마다면 대기 중에도 부담이 커서, 평소에는 30초마다만 확인한다
    interval: 30s
    timeout: 10s
    # 연속 4번(약 2분) 실패하면 unhealthy
    retries: 4
    # 기동 직후에는 5초마다 확인해, 간격을 늘려도 배포 때 healthy가 늦게 잡히지 않게 한다 (Docker Engine 25 이상)
    start_period: 60s
    start_interval: 5s

# ---------- Redis 노드 6대가 같이 쓰는 설정 (#366) ----------
# 마스터 3 + 복제본 3의 클러스터다. 마스터가 죽으면 복제본이 마스터가 되고(장애 조치), 앱은 새 마스터를 스스로 찾아간다
# 로컬 docker-compose.yml과 같은 구성이고, 다른 점은 비밀번호(requirepass·masterauth), 호스트 포트를 열지 않는 것, 모든 노드가 컨테이너 포트 6379를 쓰는 것이다
# 6대가 EC2 1대에 있어서 노드 1대 고장·리더 변경은 버티지만, EC2가 죽거나 다시 시작하면 6대가 함께 내려간다 (docs/DEPLOY.md)
x-redis-environment: &redis-environment
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD가 필요하다}
  # healthcheck와 초기화의 redis-cli가 비밀번호를 인자 없이 쓰게 한다
  REDISCLI_AUTH: ${REDIS_PASSWORD}
  # 노드가 재시작으로 IP가 바뀌어도 서로 다시 찾도록 피어 목록을 준다 (redis-cluster-rejoin.sh)
  REDIS_PEERS: "redis-1:6379 redis-2:6379 redis-3:6379 redis-4:6379 redis-5:6379 redis-6:6379"

x-redis-service: &redis-service
  image: redis:${REDIS_VERSION:-8.10}-alpine
  restart: unless-stopped
  # 비밀번호를 인자로 넘기면 호스트의 ps에 보이므로, 인자 대신 컨테이너 안 설정 파일로 넘긴다
  # 복제본이 마스터에 붙으려면 masterauth가 필요하고, 장애 조치로 복제본이 마스터가 되므로 노드 6대가 같은 비밀번호를 쓴다
  # - cluster-config-file: 노드 ID가 담겨, 볼륨에 두어야 재시작해도 같은 노드로 돌아온다
  # - cluster-node-timeout 5000: 기본 15초는 장애 감지가 느리다
  # - cluster-require-full-coverage no: 마스터 1대가 죽어도 나머지 슬롯은 계속 서비스한다
  # - cluster-announce-hostname: 앱(클라이언트)이 노드 IP가 아니라 이름(redis-N)으로 접속한다
  #   노드끼리는 이름이 아니라 nodes.conf의 IP로 찾으므로, IP가 바뀐 노드는 redis-cluster-rejoin.sh가 CLUSTER MEET으로 다시 붙인다(EC2 재부팅, down/up)
  # - noeviction은 #319 그대로(사용처가 정해지지 않아 키를 몰래 지우지 않는다, 정책 재검토는 #324). save는 가벼운 RDB만 켠다(AOF는 자원 때문에 끔)
  # - repl-backlog-size, client-output-buffer-limit replica: 복제본이 처음부터 다시 동기화(full sync)할 때 마스터가 쌓는 버퍼의 상한이다
  #   기본값(replica 256mb)이 mem_limit(128m)보다 커서, 데이터가 찬 마스터가 동기화 중 메모리 제한에 걸려 죽을 수 있다(배포 때 복제본을 다시 띄울 때마다 지나는 경로)
  #   상한을 넘으면 느린 복제본의 연결이 끊기고 다시 동기화하지만 마스터는 살아남는다
  command:
    - sh
    - -c
    - |
      umask 077
      printf 'requirepass "%s"\nmasterauth "%s"\n' "$$REDIS_PASSWORD" "$$REDIS_PASSWORD" > /tmp/redis.conf
      sh /redis-cluster-rejoin.sh &
      exec redis-server /tmp/redis.conf --cluster-enabled yes --cluster-config-file /data/nodes.conf \
        --cluster-node-timeout 5000 --cluster-require-full-coverage no \
        --cluster-announce-hostname "$$NODE_HOSTNAME" --cluster-preferred-endpoint-type hostname \
        --maxmemory 64mb --maxmemory-policy noeviction --save "900 1 300 100" --appendonly no \
        --repl-backlog-size 4mb --client-output-buffer-limit "replica 32mb 16mb 60"
  # maxmemory 64mb에 복제 버퍼·fork 여유를 더한 값. 6대 합계 768m이므로 EC2 실측 후 조정한다 (docs/DEPLOY.md)
  mem_limit: 128m
  healthcheck:
    # 클러스터가 아직 만들어지지 않았거나 슬롯이 비면 fail이라 unhealthy다. app은 6대 모두 healthy여야 시작한다
    test: ['CMD-SHELL', 'redis-cli cluster info | grep -q cluster_state:ok']
    interval: 5s
    timeout: 3s
    retries: 20

services:
  mysql:
    image: mysql:${MYSQL_VERSION:-9.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE가 필요하다}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER가 필요하다}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD가 필요하다}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD가 필요하다}
      # NOW(), CURRENT_TIMESTAMP 기본값이 앱(JVM)과 같은 시간대를 따르게 한다 (#93)
      TZ: ${APP_TIME_ZONE:-Asia/Seoul}
    volumes:
      # EBS 데이터 볼륨(/data). 인스턴스를 교체해도 데이터가 남는다
      - /data/mysql:/var/lib/mysql
      # 새 데이터 디렉터리로 처음 뜰 때만 모듈별 스키마를 만든다. 기존 데이터에는 docs/DEPLOY.md의 이전 절차를 쓴다
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis-1:
    <<: *redis-service
    environment:
      <<: *redis-environment
      NODE_HOSTNAME: redis-1
    volumes:
      - redis-1-data:/data
      - ./redis-cluster-rejoin.sh:/redis-cluster-rejoin.sh:ro

  redis-2:
    <<: *redis-service
    environment:
      <<: *redis-environment
      NODE_HOSTNAME: redis-2
    volumes:
      - redis-2-data:/data
      - ./redis-cluster-rejoin.sh:/redis-cluster-rejoin.sh:ro

  redis-3:
    <<: *redis-service
    environment:
      <<: *redis-environment
      NODE_HOSTNAME: redis-3
    volumes:
      - redis-3-data:/data
      - ./redis-cluster-rejoin.sh:/redis-cluster-rejoin.sh:ro

  redis-4:
    <<: *redis-service
    environment:
      <<: *redis-environment
      NODE_HOSTNAME: redis-4
    volumes:
      - redis-4-data:/data
      - ./redis-cluster-rejoin.sh:/redis-cluster-rejoin.sh:ro

  redis-5:
    <<: *redis-service
    environment:
      <<: *redis-environment
      NODE_HOSTNAME: redis-5
    volumes:
      - redis-5-data:/data
      - ./redis-cluster-rejoin.sh:/redis-cluster-rejoin.sh:ro

  redis-6:
    <<: *redis-service
    environment:
      <<: *redis-environment
      NODE_HOSTNAME: redis-6
    volumes:
      - redis-6-data:/data
      - ./redis-cluster-rejoin.sh:/redis-cluster-rejoin.sh:ro

  # 노드 6대를 클러스터로 묶고 끝나는 1회성 서비스. 이미 묶여 있으면 아무것도 하지 않는다 (redis-cluster-init.sh)
  # 노드의 healthcheck가 cluster_state:ok라 클러스터를 만들기 전에는 healthy가 될 수 없으므로, 노드가 healthy가 아니라 started이면 시작한다
  redis-cluster-init:
    image: redis:${REDIS_VERSION:-8.10}-alpine
    restart: "no"
    depends_on:
      redis-1:
        condition: service_started
      redis-2:
        condition: service_started
      redis-3:
        condition: service_started
      redis-4:
        condition: service_started
      redis-5:
        condition: service_started
      redis-6:
        condition: service_started
    environment:
      REDIS_NODES: redis-1:6379 redis-2:6379 redis-3:6379 redis-4:6379 redis-5:6379 redis-6:6379
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD가 필요하다}
    volumes:
      - ./redis-cluster-init.sh:/redis-cluster-init.sh:ro
    command: ['sh', '/redis-cluster-init.sh']

  # 브로커 3대는 이름·번호만 다르다. 1대씩 다시 띄우는 순서는 deploy.sh가 맡는다
  kafka-1:
    <<: *kafka-service
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-service
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-service
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  app:
    image: ghcr.io/prgrms-be-adv-devcourse/paldo-gotgan:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    # default: mysql·nginx와 통신 / kafka-net: 브로커 접속 / edge: 프론트 BFF가 app:8080으로 부른다
    # mysql·nginx는 기본 네트워크에 그대로 둔다. 네트워크를 바꾸면 배포 때 mysql 컨테이너를 새로 만들어 DB가 잠깐 끊긴다
    networks: [default, kafka-net, edge]
    depends_on:
      mysql:
        condition: service_healthy
      # mysql과 같이 Redis 6대도 healthy(cluster_state:ok)가 된 뒤에 앱을 띄워, 기동 직후 Redis 연결이 실패할 여지를 없앤다 (#366)
      # 대신 Redis가 healthy가 되지 못하면(예: REDIS_PASSWORD 형식 오류, 클러스터 초기화 실패) 앱이 뜨지 않고 배포가 실패한다
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      redis-4:
        condition: service_healthy
      redis-5:
        condition: service_healthy
      redis-6:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      # mysql과 같이 Kafka 3대도 healthy가 된 뒤에 앱을 띄운다 (#318)
      # 대신 브로커가 healthy가 되지 못하면 앱이 뜨지 않고 배포가 실패한다. 헬스체크 오판으로 배포가 자주 막히면 service_started로 바꾼다
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    # env_file을 쓰지 않고 앱이 쓰는 값만 넘긴다. MYSQL_ROOT_PASSWORD 같은 값이 앱 컨테이너에 들어가지 않게 하기 위함이다
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Seoul}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=${APP_TIME_ZONE:-Asia/Seoul}&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # 노드 6대를 모두 적어, 1대가 죽어 있어도 나머지로 처음 접속한다. 이후 토폴로지는 앱이 스스로 읽는다 (#366)
      REDIS_CLUSTER_NODES: redis-1:6379,redis-2:6379,redis-3:6379,redis-4:6379,redis-5:6379,redis-6:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 브로커 3대를 모두 적어, 1대가 죽어 있어도 나머지로 처음 접속한다
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:?TOSS_SECRET_KEY가 필요하다}
      JEV_API_KEY: ${JEV_API_KEY:?JEV_API_KEY가 필요하다}
      AWS_REGION: ${AWS_REGION:?AWS_REGION이 필요하다}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET이 필요하다}
      PROBLEM_BASE_URI: ${PROBLEM_BASE_URI:-about:blank}
      ADMIN_BOOTSTRAP_LOGIN_ID: ${ADMIN_BOOTSTRAP_LOGIN_ID:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      # HS256 시절 이미지로 롤백할 때만 쓴다. 지금 버전은 읽지 않는다 (키는 아래 keys 폴더의 jwt.yaml).
      # 남겨 두는 이유: APP_IMAGE_TAG만 바꾸는 표준 롤백(docs/DEPLOY.md 4절)으로 이전 이미지가 뜨게 하기 위해서다
      # TODO(#313): RS256 버전이 운영에서 안정된 뒤 서버 .env의 JWT_SECRET과 함께 이 줄을 지운다
      JWT_SECRET: ${JWT_SECRET:-}
      # 컨테이너 메모리 제한(mem_limit) 기준으로 힙을 잡는다. t3.large(8GB)에 MySQL·Redis(6대 합계 768m)·Kafka(3대 약 2GB)를 함께 올리면
      # 남는 메모리(약 0.8~1.3GiB)가 이 앱 하나보다 작아, 앱 인스턴스를 더 띄우려면 메모리 예산을 다시 잡아야 한다 (docs/DEPLOY.md)
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    volumes:
      # 서버의 /opt/paldo-gotgan/keys. JWT 키 PEM과 그 설정(jwt.yaml)을 둔다. 앱은 application-prod.yml에서 jwt.yaml을 읽는다
      # 컨테이너 사용자(uid 1001)가 읽을 수 있어야 한다. 키 생성·배치는 docs/DEPLOY.md 9절
      - ./keys:/run/secrets/jwt:ro
    mem_limit: 2560m
    healthcheck:
      # 런타임 이미지가 alpine이라 curl 대신 busybox wget을 쓴다
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health | grep -q UP']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    # BFF는 프론트 레포가 따로 띄우므로 기다리지 않는다. BFF가 없거나 죽어도 nginx는 뜨고 요청만 502가 난다
    depends_on:
      app:
        condition: service_healthy
    # edge: 프론트 compose의 bff(8787)로 /api/v1/과 /bff/를 보낸다
    networks: [default, edge]
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  kafka-net:
  # 프론트 레포의 BFF compose(/opt/paldo-gotgan-bff)가 external로 붙는 네트워크다.
  # 이름은 두 레포의 계약이라 프로젝트 이름이 붙지 않게 고정한다. 바꾸면 프론트 deploy/compose.prod.yml도 같이 바꾼다
  edge:
    name: paldo-edge

# 브로커마다 따로 둔다. 도커 볼륨이라 루트 디스크(/var/lib/docker)에 쌓인다
# 인스턴스를 교체하면 루트 디스크와 함께 사라져 아직 안 읽힌 메시지도 사라진다. 원본 데이터는 DB에 있으므로 받아들인다
# Redis도 노드마다 따로 둔다. 볼륨에는 노드 ID(nodes.conf)와 RDB가 들어 있어, 지우면 6대를 모두 지워 새 클러스터로 시작해야 한다 (#366)
volumes:
  redis-1-data:
  redis-2-data:
  redis-3-data:
  redis-4-data:
  redis-5-data:
  redis-6-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
