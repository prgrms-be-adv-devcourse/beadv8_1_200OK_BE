# 모든 앱(monolith, 모듈 단독 실행)이 같은 Redis 설정을 쓴다 (#319)
# 각 앱의 application*.yaml이 spring.config.import로 이 파일을 가져온다. 값을 바꿀 곳은 여기 한 곳이다
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 비어 있으면 비밀번호 없이 접속한다 (로컬)
      password: ${REDIS_PASSWORD:}
      # Redis가 응답하지 않을 때 요청 스레드가 오래 묶이지 않게 짧게 둔다
      connect-timeout: 2s
      timeout: 1s
      repositories:
        # JPA와 함께 있을 때 리포지터리마다 저장소를 판정하는 로그가 쌓인다. Redis 리포지터리는 쓰지 않는다
        enabled: false
management:
  health:
    redis:
      # 아직 Redis에 의존하는 기능이 없어 Redis 장애가 앱 상태(헬스체크)를 정하면 안 된다
      enabled: false
