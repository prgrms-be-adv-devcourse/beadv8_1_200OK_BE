# Redis를 쓰는 앱이 spring.config.import로 가져다 쓰는 공통 Redis 설정 (#319)
# 지금은 monolith가 가져온다. 모듈은 Redis를 쓰기 시작할 때 자기 yaml의 import에 추가한다. 값을 바꿀 곳은 여기 한 곳이다
spring:
  data:
    redis:
      # 6노드 클러스터(마스터 3 + 복제본 3)에 접속한다 (#366). 노드 목록은 시작 지점일 뿐이고, 앱이 접속한 뒤 나머지 노드와 역할은 스스로 알아낸다
      # 기본값은 로컬 docker compose 노드다. 노드 이름(redis-N.localhost)은 내 PC와 컨테이너 안 어디서든 같은 포트로 닿는다
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:redis-1.localhost:7001,redis-2.localhost:7002,redis-3.localhost:7003,redis-4.localhost:7004,redis-5.localhost:7005,redis-6.localhost:7006}
        # 노드가 슬롯 이동(MOVED/ASK)을 알려 주면 따라가는 최대 횟수
        max-redirects: 3
      # 비어 있으면 비밀번호 없이 접속한다 (로컬)
      password: ${REDIS_PASSWORD:}
      # Redis가 응답하지 않을 때 요청 스레드가 오래 묶이지 않게 짧게 둔다
      connect-timeout: 2s
      timeout: 1s
      lettuce:
        # 읽기는 복제본을 우선해 마스터 부담을 나눈다. 복제는 비동기라 마지막 쓰기보다 오래된 값을 읽을 수 있다
        # 그래서 락·중복 방지는 읽고 판단하지 말고 SET NX나 Lua 같은 원자적 명령(항상 마스터로 감)을 쓴다 (docs/DEVELOPMENT.md)
        read-from: replicaPreferred
        cluster:
          refresh:
            # 장애 조치로 마스터가 바뀌어도 앱이 새 마스터를 찾도록 토폴로지를 주기적으로 다시 읽는다
            # 리다이렉트·재연결 반복·알 수 없는 노드를 만났을 때 바로 다시 읽는 adaptive 갱신은 Lettuce 기본값으로 켜져 있다 (RedisSettingsTest가 확인)
            period: 30s
      repositories:
        # JPA와 함께 있을 때 리포지터리마다 저장소를 판정하는 로그가 쌓인다. Redis 리포지터리는 쓰지 않는다
        enabled: false
