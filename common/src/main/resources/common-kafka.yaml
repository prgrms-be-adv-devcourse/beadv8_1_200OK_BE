# Kafka를 쓰는 앱이 spring.config.import로 가져다 쓰는 공통 Kafka 설정 (#538)
# 직렬화 방식이 앱마다 다르면 보내는 쪽과 받는 쪽이 메시지를 서로 읽지 못하므로, 값을 바꿀 곳은 여기 한 곳이다
# import한 파일의 값은 import한 앱 yaml보다 우선한다(Boot 규칙). 접속 주소와 그룹은 환경 변수(.env)로 바꾼다
spring:
  kafka:
    # cluster는 브로커 3대를 모두 적어 1대가 죽어 있어도 처음 접속한다. single이면 첫 주소(KAFKA_1_PORT)만 맞으면 된다
    # 기본값은 로컬 compose의 브로커(127.0.0.1에만 열림)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
    producer:
      # 복제본이 있으면 min.insync.replicas(cluster는 2)만큼 저장돼야 발행 성공으로 본다. 단일 브로커는 리더 1대에 저장되면 성공이다
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # 받는 쪽이 보내는 쪽 Java 클래스를 몰라도 되도록 타입 헤더를 싣지 않는다
        spring.json.add.type.headers: false
    consumer:
      # 기본은 앱 이름. 서비스로 나누면 서비스마다 그룹이 달라져 같은 이벤트를 각자 받는다
      group-id: ${KAFKA_CONSUMER_GROUP_ID:${spring.application.name}}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # JSON으로 못 읽는 메시지 하나 때문에 컨슈머가 같은 메시지에서 멈추지 않게 실패를 오류 처리로 넘긴다
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # 타입 헤더가 없으므로 읽을 타입은 리스너(토픽)마다 정한다
        spring.json.use.type.headers: false
