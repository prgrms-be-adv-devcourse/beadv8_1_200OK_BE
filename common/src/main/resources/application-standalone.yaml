# 모듈 단독 앱(와 모듈 서브프로젝트의 테스트)의 기본 설정. standalone 프로파일에서만 읽는다
# monolith의 application.yaml 중 모든 모듈이 쓰는 값과 같게 둔다. 모듈마다 다른 값은 모듈의 application-<모듈>.yaml에 있다
# TODO: 공통 값이 monolith application.yaml과 이 파일에 두 벌 있다. 한 파일로 합치는 일은 후속으로 다룬다
ok:
  flyway:
    # 접속 기본 DB가 모듈 자기 스키마라서 common 마이그레이션도 모듈 Flyway가 함께 적용한다 (ModuleFlyway)
    standalone: true
server:
  port: ${SERVER_PORT:${ok.port:8080}}
spring:
  application:
    name: ${ok.module:module}
  config:
    # 루트 .env(JWT_SECRET 같은 공유 값)를 먼저, 실행 디렉터리의 .env(모듈 DB 계정)를 나중에 읽어 모듈 값이 이기게 한다
    # OK_ROOT_DIR은 모듈 bootRun이 저장소 루트로 지정한다(ok.spring-module-conventions). 없으면 실행 디렉터리의 .env만 읽는다
    import: optional:file:${OK_ROOT_DIR:.}/.env[.properties],optional:file:.env[.properties]
  datasource:
    # monolith용 DB_URL과 섞이지 않도록 DB_URL을 읽지 않는다. 접속 기본 DB는 모듈 자기 스키마(ok.schema)다
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${ok.schema}?serverTimezone=${APP_TIME_ZONE:Asia/Seoul}&characterEncoding=UTF-8
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:password}
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Seoul}
    serialization:
      fail-on-empty-beans: false
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
          time_zone: ${APP_TIME_ZONE:Asia/Seoul}
  flyway:
    # 순서가 뒤바뀐 마이그레이션 허용 여부. 기본은 운영과 같게 막고, 개발 환경에서 필요하면 FLYWAY_OUT_OF_ORDER=true로 연다
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
  modulith:
    events:
      republish-outstanding-events-on-restart: ${MODULITH_REPUBLISH_ON_RESTART:false}
app:
  problem:
    base-uri: ${PROBLEM_BASE_URI:about:blank}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:local-bucket}
jwt:
  issuer: paldo-gotgan
  audience: paldo-gotgan-api
  key-id: hs256-v1
  # .env로 읽은 값은 OS 환경 변수가 아니라 일반 프로퍼티라서 JWT_SECRET이 jwt.secret으로 자동 바인딩되지 않는다. 직접 참조한다
  # 값이 없으면 빈 문자열이 되어 JwtProperties의 검증 메시지가 나온다(테스트는 application-test.yml 값)
  secret: ${JWT_SECRET:}
  access-token-expiration: 30m
  refresh-token-expiration: 14d
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    com.ok: ${LOG_LEVEL_OK:INFO}
