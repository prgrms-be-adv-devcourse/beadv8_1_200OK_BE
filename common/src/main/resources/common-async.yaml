# 비동기 실행기(가상 스레드)의 공통 설정. 앱이 spring.config.import로 가져다 쓴다
# 값을 바꿀 곳은 여기와 각 앱의 yml이다. 운영에서는 재빌드 없이 환경 변수(.env)로 덮어쓴다. 값은 기동할 때 한 번 읽으므로 바꾸면 재시작해야 한다
# 실행기를 추가하려면 아래 executors에 이름을 붙여 항목을 넣고, 그 이름을 쓰는 모듈이 @Bean 한 줄로 선언한다 (AsyncExecutorFactory 참고)
# 이름은 monolith에서 빈 이름이 겹치지 않게 모듈 이름을 앞에 붙인다 (예: order-external-api)
# 값의 의미는 AsyncProperties 참고
app:
  async:
    # 이름을 지정하지 않은 @Async(= @ApplicationModuleListener)가 쓰는 실행기. 아래 executors에 있는 이름이어야 한다
    default-executor: event
    executors:
      # 이벤트 리스너용 공통 실행기
      event:
        # 동시에 실행할 리스너 수 상한. 리스너마다 DB 커넥션을 하나씩 쓰므로 spring.datasource.hikari.maximum-pool-size(기본 10)보다 작게 둔다.
        # 같거나 크면 리스너가 커넥션을 다 차지해 HTTP 요청이 커넥션을 얻지 못한다
        concurrency-limit: ${ASYNC_EVENT_CONCURRENCY_LIMIT:5}
        # false: 상한에 걸리면 이벤트를 넘기는 쪽(요청 스레드)이 빈자리가 날 때까지 기다린다. 이벤트는 유실되지 않고 응답만 늦어진다
        # true: 기다리지 않고 거절한다. 커밋은 이미 끝난 뒤라 거절 예외가 요청 쪽으로 올라가 응답이 500이 될 수 있다. 쓰기 전에 동작을 확인한다
        reject-tasks-when-limit-reached: ${ASYNC_EVENT_REJECT_WHEN_LIMIT_REACHED:false}
        # 앱 종료 때 실행 중인 리스너를 기다리는 시간. 끝나지 못한 이벤트는 미완료로 남아 재시작 때 재발행된다(republish-outstanding-events-on-restart)
        task-termination-timeout: ${ASYNC_EVENT_TERMINATION_TIMEOUT:10s}
        # 로그에서 리스너 스레드를 구분하는 이름 앞부분
        thread-name-prefix: event-
