spring:
  config:
    # JWT 키 목록과 서명 키(jwt.verification-keys, jwt.signing)를 서버 키 폴더의 jwt.yaml에서 읽는다.
    # 키를 교체·폐기할 때 이미지를 다시 만들지 않고 이 파일과 PEM만 바꿔 재시작하기 위해서다. 작성법은 docs/DEPLOY.md 9절
    # optional을 붙이지 않는다. 파일이 없을 때 로컬 기본 경로로 넘어가면 원인과 다른 "키 파일을 읽을 수 없음" 오류가 나기 때문이다
    import: file:/run/secrets/jwt/jwt.yaml
  docker:
    compose:
      enabled: true
  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: never
  jpa:
    hibernate:
      ddl-auto: validate
  modulith:
    events:
      republish-outstanding-events-on-restart: true
logging:
  level:
    com.ok: INFO
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
