ok:
  flyway:
    standalone: true
server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: payout
  config:
    # Kafka 접속·직렬화 설정은 common-kafka.yaml 한 곳에서 관리한다. 앱마다 다르면 서로 메시지를 읽지 못한다 (#538)
    import: optional:file:${OK_ROOT_DIR:.}/.env[.properties],optional:file:.env[.properties],classpath:common-kafka.yaml,classpath:common-async.yaml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/paldogotgan_payout?serverTimezone=${APP_TIME_ZONE:Asia/Seoul}&characterEncoding=UTF-8
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:password}
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Seoul}
    serialization:
      fail-on-empty-beans: false
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
          time_zone: ${APP_TIME_ZONE:Asia/Seoul}
  flyway:
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
  modulith:
    events:
      republish-outstanding-events-on-restart: ${MODULITH_REPUBLISH_ON_RESTART:false}
  batch:
    job:
      # 앱 시작 시 Job 자동 실행 여부. 기본은 false로 자동 실행하지 않는다(운영도 false 고정, #245)
      # true로 켜면 파라미터 없이 실행되어 Job 시작 전 검사(#485)에 걸려 앱이 시작되지 않는다. 정산은 스케줄러와 관리자 API로 실행한다
      enabled: ${BATCH_JOB_ENABLED:false}
    jdbc:
      # 배치 메타데이터 테이블은 Flyway 마이그레이션으로 관리하므로 자동 생성 안 함
      initialize-schema: never

app:
  problem:
    base-uri: ${PROBLEM_BASE_URI:about:blank}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:local-bucket}
jwt:
  issuer: paldo-gotgan
  audience: paldo-gotgan-api
  # 발급 모듈(member)의 JWKS 주소. 설정하면 공개키를 이 주소에서 받아 검증하고, 아래 verification-keys는 읽지 않는다.
  # 비어 있으면(로컬 기본값) 아래 공개키 파일로 검증한다. 모듈을 따로 배포할 때 환경변수로 넣는다 (docs/DEVELOPMENT.md 8절)
  jwk-set-uri: ${JWT_JWK_SET_URI:}
  # 검증용 공개키 목록. 토큰 헤더의 kid로 키를 고른다. 키 교체 절차는 docs/DEVELOPMENT.md 8절
  verification-keys:
    - key-id: rs256-v1
      public-key: file:${OK_ROOT_DIR:.}/keys/rs256-v1-public.pem
  access-token-expiration: 30m
  refresh-token-expiration: 14d
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    com.ok: ${LOG_LEVEL_OK:INFO}
payout:
  skip-wait-run:
    # 대기 건너뛰기 실행(POST /api/v1/admin/payouts/run/skip-wait) 스위치. 기본 꺼짐이고, 꺼져 있으면 409로 거절한다
    # 발표·연동 테스트 때만 정산을 단독으로 띄우고 환경 변수 PAYOUT_SKIP_WAIT_RUN_ENABLED=true로 켠다.
    # monolith는 이 파일을 읽지 않아 기본은 꺼져 있다. 단, 로컬 docker-compose처럼 .env를 통째로 넘기면 같은 환경 변수로 monolith도 켜진다 (#485)
    enabled: ${PAYOUT_SKIP_WAIT_RUN_ENABLED:false}
