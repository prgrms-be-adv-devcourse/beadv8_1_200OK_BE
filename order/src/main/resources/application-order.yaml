ok:
  flyway:
    standalone: true
server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: order
  config:
    import: optional:file:${OK_ROOT_DIR:.}/.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/paldogotgan_order?serverTimezone=${APP_TIME_ZONE:Asia/Seoul}&characterEncoding=UTF-8
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:password}
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Seoul}
    serialization:
      fail-on-empty-beans: false
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 비어 있으면 비밀번호 없이 접속한다 (로컬)
      password: ${REDIS_PASSWORD:}
      # Redis가 응답하지 않을 때 요청 스레드가 오래 묶이지 않게 짧게 둔다
      connect-timeout: 2s
      timeout: 1s
      repositories:
        # JPA와 함께 있을 때 리포지터리마다 저장소를 판정하는 로그가 쌓인다. Redis 리포지터리는 쓰지 않는다
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
          time_zone: ${APP_TIME_ZONE:Asia/Seoul}
  flyway:
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
  modulith:
    events:
      republish-outstanding-events-on-restart: ${MODULITH_REPUBLISH_ON_RESTART:false}
app:
  problem:
    base-uri: ${PROBLEM_BASE_URI:about:blank}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:local-bucket}
jwt:
  issuer: paldo-gotgan
  audience: paldo-gotgan-api
  key-id: hs256-v1
  secret: ${JWT_SECRET:}
  access-token-expiration: 30m
  refresh-token-expiration: 14d
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # 아직 Redis에 의존하는 기능이 없어 Redis 장애가 앱 상태(헬스체크)를 정하면 안 된다
      enabled: false
logging:
  level:
    com.ok: ${LOG_LEVEL_OK:INFO}
