# 배포 브랜치(semi)에 push되면 앱 이미지를 빌드해 GHCR에 올린다. 서버 배포는 EC2에서 deploy.sh로 한다 (docs/DEPLOY.md)
# semi는 세미 프로젝트까지 쓰는 임시 배포 브랜치다. main에 머지가 자주 일어나 당분간 semi에서 확인하고, 이후 main으로 옮긴다
name: Docker Image

on:
  push:
    branches: [semi]
  workflow_dispatch:

# 한 번에 하나만 실행해 늦게 시작한 빌드가 먼저 끝나 latest가 이전 커밋 이미지로 덮이지 않게 한다.
# 대기 중인 실행은 하나만 남고 새 실행이 오면 대기 중이던 것은 취소되므로, semi를 연달아 올리면 중간 커밋의 SHA 태그는 생기지 않을 수 있다
concurrency:
  group: docker-image
  cancel-in-progress: false

env:
  # deploy/compose.prod.yml의 이미지 이름과 같아야 한다
  IMAGE: ghcr.io/prgrms-be-adv-devcourse/paldo-gotgan

jobs:
  build:
    # 수동 실행에서 다른 브랜치를 고르면 배포 대상이 아닌 코드가 latest가 되므로 배포 브랜치만 빌드한다
    if: github.ref == 'refs/heads/semi'
    runs-on: ubuntu-latest
    # 빌드가 멈추면 concurrency 대기열 전체가 막히므로 시간을 제한한다
    timeout-minutes: 30
    # 패키지 쓰기 권한은 이 워크플로에만 준다. PR 워크플로에는 주지 않는다
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 롤백할 때 deploy/.env의 APP_IMAGE_TAG에 넣는 값이다
      - name: 커밋 SHA 7자리
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          # 운영 deploy.sh가 latest로 받은 이미지의 커밋 SHA를 배포 이력에 남길 때 읽는다
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
