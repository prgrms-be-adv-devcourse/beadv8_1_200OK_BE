# dev에 머지되면 앱 이미지를 빌드해 GHCR에 올린다. 서버 배포는 EC2에서 deploy.sh로 한다 (docs/DEPLOY.md)
name: Docker Image

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 연속 머지 때 늦게 시작한 빌드가 먼저 끝나 latest가 이전 커밋 이미지로 덮이지 않도록 한 번에 하나씩 순서대로 실행한다
concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 패키지 쓰기 권한은 이 워크플로에만 준다. PR 워크플로에는 주지 않는다
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 롤백할 때 deploy/.env의 APP_IMAGE_TAG에 넣는 값이다
      - name: 커밋 SHA 7자리
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 이미지 이름은 deploy/compose.prod.yml과 같아야 한다
          tags: |
            ghcr.io/prgrms-be-adv-devcourse/paldo-gotgan:latest
            ghcr.io/prgrms-be-adv-devcourse/paldo-gotgan:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
