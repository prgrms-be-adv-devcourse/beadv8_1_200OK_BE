ok:
  flyway:
    standalone: true
server:
  port: ${SERVER_PORT:8086}
spring:
  application:
    name: delivery
  config:
    # Kafka 설정은 common의 common-kafka.yaml 한 곳에서 관리한다 (#318)
    import: optional:file:${OK_ROOT_DIR:.}/.env[.properties],optional:file:.env[.properties],classpath:common-kafka.yaml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/paldogotgan_delivery?serverTimezone=${APP_TIME_ZONE:Asia/Seoul}&characterEncoding=UTF-8
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:password}
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Seoul}
    serialization:
      fail-on-empty-beans: false
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
          time_zone: ${APP_TIME_ZONE:Asia/Seoul}
  flyway:
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
  modulith:
    events:
      republish-outstanding-events-on-restart: ${MODULITH_REPUBLISH_ON_RESTART:false}
app:
  problem:
    base-uri: ${PROBLEM_BASE_URI:about:blank}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:local-bucket}
jwt:
  issuer: paldo-gotgan
  audience: paldo-gotgan-api
  key-id: hs256-v1
  secret: ${JWT_SECRET:}
  access-token-expiration: 30m
  refresh-token-expiration: 14d
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    com.ok: ${LOG_LEVEL_OK:INFO}
delivery:
  # 배송 설정을 등록하지 않은 판매자에게 적용한다 (#122). 세 값 모두 필수이고, 빠지면 기동이 실패한다
  default-shipping:
    base-shipping-fee: 3000
    free-shipping-threshold: 50000
    cutoff-time: "13:00"
