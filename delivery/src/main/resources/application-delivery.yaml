ok:
  flyway:
    standalone: true
server:
  port: ${SERVER_PORT:8086}
spring:
  application:
    name: delivery
  config:
    import: optional:file:${OK_ROOT_DIR:.}/.env[.properties],optional:file:.env[.properties],classpath:common-async.yaml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/paldogotgan_delivery?serverTimezone=${APP_TIME_ZONE:Asia/Seoul}&characterEncoding=UTF-8
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:password}
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Seoul}
    serialization:
      fail-on-empty-beans: false
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
          time_zone: ${APP_TIME_ZONE:Asia/Seoul}
  flyway:
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
  modulith:
    events:
      republish-outstanding-events-on-restart: ${MODULITH_REPUBLISH_ON_RESTART:false}
app:
  problem:
    base-uri: ${PROBLEM_BASE_URI:about:blank}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:local-bucket}
jwt:
  issuer: paldo-gotgan
  audience: paldo-gotgan-api
  # 발급 모듈(member)의 JWKS 주소. 설정하면 공개키를 이 주소에서 받아 검증하고, 아래 verification-keys는 읽지 않는다.
  # 비어 있으면(로컬 기본값) 아래 공개키 파일로 검증한다. 모듈을 따로 배포할 때 환경변수로 넣는다 (docs/DEVELOPMENT.md 8절)
  jwk-set-uri: ${JWT_JWK_SET_URI:}
  # 검증용 공개키 목록. 토큰 헤더의 kid로 키를 고른다. 키 교체 절차는 docs/DEVELOPMENT.md 8절
  verification-keys:
    - key-id: rs256-v1
      public-key: file:${OK_ROOT_DIR:.}/keys/rs256-v1-public.pem
  access-token-expiration: 30m
  refresh-token-expiration: 14d
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    com.ok: ${LOG_LEVEL_OK:INFO}
delivery:
  carrier:
    # mock: 일정 시간 뒤 배송 완료를 알리는 가짜 택배사(기본). tracker: Delivery Tracker로 실제 배송 상태를 조회한다
    type: ${DELIVERY_CARRIER_TYPE:mock}
    tracker:
      base-url: https://apis.tracker.delivery/graphql
      auth-url: https://auth.tracker.delivery/oauth2/token
      client-id: ${DELIVERY_TRACKER_CLIENT_ID:}
      client-secret: ${DELIVERY_TRACKER_CLIENT_SECRET:}
      # 무료 플랜은 웹훅이 없어 조회로 확인한다. 호출 제한이 확인되기 전까지 넉넉하게 둔다
      poll-interval: ${DELIVERY_TRACKER_POLL_INTERVAL:5m}
      connect-timeout: 3s
      read-timeout: 15s
  # 배송 설정을 등록하지 않은 판매자에게 적용한다 (#122). 세 값 모두 필수이고, 빠지면 기동이 실패한다
  default-shipping:
    base-shipping-fee: 3000
    free-shipping-threshold: 50000
    cutoff-time: "13:00"
