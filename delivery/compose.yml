# delivery 모듈만 컨테이너로 띄운다 (#783). 저장소 루트에서 실행한다
#   docker compose up -d                                  # MySQL·Redis·Kafka를 먼저 띄운다
#   docker compose -f delivery/compose.yml up -d --build
# 공통 설정(접속 주소, JWT 키, healthcheck)은 docker-compose.module.yml에 있다
name: server-delivery

services:
  delivery:
    extends:
      file: ../docker-compose.module.yml
      service: module
    build:
      args:
        MODULE: delivery
    image: paldo-gotgan-delivery:local
    # 모듈 DB 계정(DB_USERNAME, DB_PASSWORD). infra/mysql/sync-module-users.sh --init 이 만든다
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_PORT: 8086
    ports:
      - "8086:8086"

# 루트 docker-compose.yml이 만든 네트워크에 붙는다. 루트를 먼저 올리지 않으면 네트워크가 없어 시작에 실패한다
networks:
  db-net:
    external: true
  kafka-net:
    external: true
