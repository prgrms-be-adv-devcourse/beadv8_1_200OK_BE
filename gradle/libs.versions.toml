[versions]
spring-boot = "4.1.1"
dependency-management = "1.1.7"
spring-modulith = "2.1.1"
aws-sdk = "2.55.12"
querydsl = "7.7"
springdoc = "3.1.1"
archunit = "1.5.1"
thumbnailator = "0.4.21"
owasp-html-sanitizer = "20260924.2"

[libraries]
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "dependency-management" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
querydsl-jpa = { module = "io.github.openfeign.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "io.github.openfeign.querydsl:querydsl-apt", version.ref = "querydsl" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
thumbnailator = { module = "net.coobird:thumbnailator", version.ref = "thumbnailator" }
owasp-html-sanitizer = { module = "com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer", version.ref = "owasp-html-sanitizer" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
